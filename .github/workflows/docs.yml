name: docs
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read, pages: write, id-token: write }
jobs:
  docs:
    name: Build and publish docs
    uses: Zebradil/docs-kit/.github/workflows/docs.yml@b02d0071d467b6a2d7b646ecf05567cf2c11f9de # v0.12.0
    with:
      nix: true
      # The live demo page embeds this build; it also keeps the library compiling for wasm32.
      prebuild: nix run .#web-demo -- docs/public/viewer
