[package]
name = "scry"
version = "0.2.0"
edition = "2024"
description = "Preview what a change to a Nix fleet does to each machine"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
base64 = "0.23.1"
clap = { version = "4", features = ["derive"] }
clap_complete = { version = "4.6.11", features = ["unstable-dynamic"] }
flate2 = "1"
libc = "0.2"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "3.2.1"
tar = "0.4"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
unicode-width = "0.2"

[dev-dependencies]
insta = { version = "=1.49.0", features = ["json"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "test-util", "time"] }
