[package]
name = "scry"
version = "0.1.0"
edition = "2024"
description = "Preview what a change to a Nix fleet does to each machine"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"
