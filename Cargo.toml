[package]
name = "scry"
version = "0.1.0"
edition = "2024"
description = "Preview what a change to a Nix fleet does to each machine"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "3.2.1"
tar = "0.4"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "sync", "time"] }
unicode-width = "0.2"

[dev-dependencies]
insta = { version = "1.49", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "test-util", "time"] }
