[package]
name = "scry-web"
version = "0.0.0"
edition = "2024"
description = "scry's viewer in a browser, on a saved report"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
ratzilla = "0.3.1"
scry = { path = ".." }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "FontFaceSet", "HtmlElement", "Window"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
