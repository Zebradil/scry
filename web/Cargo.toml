[package]
name = "scry-web"
version = "0.0.0"
edition = "2024"
description = "scry's viewer in a browser, on a saved report"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
ratzilla = "0.3.1"
scry = { path = ".." }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
