<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>scry demo</title>
    <link data-trunk rel="rust" data-bin="scry-web" data-wasm-opt="z" />
    <link data-trunk rel="copy-dir" href="fonts" />
    <style>
      @font-face {
        font-family: "JetBrains Mono";
        src: url("fonts/JetBrainsMono-Regular.woff2") format("woff2");
        font-weight: 400;
      }
      @font-face {
        font-family: "JetBrains Mono";
        src: url("fonts/JetBrainsMono-Bold.woff2") format("woff2");
        font-weight: 700;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1a1b26;
      }
      /* The size web/src/main.rs loads the font at. */
      body {
        font: 14px "JetBrains Mono", monospace;
      }
      pre {
        font: inherit;
        margin: 0;
      }
      [tabindex]:focus {
        outline: none;
      }
    </style>
  </head>
  <body>
    <script type="module">
      // The viewer's keys, kept from the browser: Tab moves focus, space and the arrows
      // scroll, `/` and `'` open Firefox's quick find.
      const keys = new Set(["Tab", " ", "/", "'", "ArrowUp", "ArrowDown", "PageUp", "PageDown"]);
      document.addEventListener("keydown", (event) => {
        if (keys.has(event.key)) event.preventDefault();
      });
    </script>
  </body>
</html>
